name: Metrics

on:
  # Refresh once a day
  schedule:
    - cron: "0 0 * * *"
  # Allow a manual run from the Actions tab
  workflow_dispatch:
  # Refresh on push so the first run happens immediately
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ksuthar21
          filename: github-metrics.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_animations: no
          optimize: css, xml
          extras_css: |
            svg { background: #1a1b27; color: #c0caf5; }
            h1, h2, h3 { color: #70a5fd !important; }
            .field { color: #c0caf5 !important; }
            a { color: #70a5fd !important; }

      - name: Languages card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ksuthar21
          filename: github-metrics-languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_animations: no
          optimize: css, xml
          plugin_languages: yes
          plugin_languages_limit: 8
          extras_css: |
            svg { background: #1a1b27; color: #c0caf5; }
            h1, h2, h3 { color: #70a5fd !important; }
            .field { color: #c0caf5 !important; }
            a { color: #70a5fd !important; }
